<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜间血氧</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="血氧">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1524" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: phone-first single column — selected night (stats + chart) on top, night list below. */
:root {
  --bg: #eef2f7; --surface: #ffffff; --ink: #16233a; --muted: #5a6680; --line: #d3dae6;
  --night: #2b4a8b; --night-soft: #dfe7f6; --low: #d2493b; --warn: #b7791f; --ok: #2f855a;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1524; --surface: #172036; --ink: #e5eaf4; --muted: #9aa6bf; --line: #2a3654;
          --night: #8fb0f2; --night-soft: #1f2d4f; --low: #f07a6c; --warn: #f0b85c; --ok: #6fd39b; color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); }
body { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: grid; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .02em; }
.sub { color: var(--muted); font-size: 13px; }
button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.btn { background: var(--night); color: var(--surface); font-weight: 600; }
.btn.ghost { background: var(--night-soft); color: var(--night); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--night); outline-offset: 2px; }
.controls { display: flex; gap: 8px; align-items: center; }
select { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.center { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 28px 16px; }
.msg { color: var(--muted); font-size: 14px; }
.err { color: var(--low); font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.night-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.night-title h2 { margin: 0; font-size: 19px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-block: 12px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .low { color: var(--low); }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--ink); color: var(--bg);
       font-family: var(--mono); font-size: 12px; padding: 3px 7px; border-radius: 6px; pointer-events: none; white-space: nowrap; }
.episodes { font-size: 13px; color: var(--muted); margin-top: 8px; }
.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; text-align: left;
       background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; color: var(--ink); width: 100%; }
.row[aria-pressed="true"] { border-color: var(--night); box-shadow: inset 3px 0 0 var(--night); }
.row .d { font-weight: 600; }
.row .d small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.row .n { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
.row .n small { display: block; color: var(--muted); font-size: 11px; font-family: var(--font); }
.trend svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.foot { font-size: 12px; color: var(--muted); line-height: 1.6; }
@media (max-width: 380px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>夜间血氧</h1>
      <div class="sub" id="sub">Fitbit Air · 逐分钟 SpO₂</div>
    </div>
    <div class="controls" id="controls" hidden>
      <select id="days" aria-label="显示天数">
        <option value="7">7 晚</option>
        <option value="14">14 晚</option>
        <option value="30">30 晚</option>
      </select>
      <button class="btn ghost" id="refresh" type="button">刷新</button>
    </div>
  </header>

  <section class="card center" id="login" hidden>
    <p class="msg">登录你的 Google 账号，读取 Fitbit Air 夜间逐分钟血氧。<br>只读权限，数据只在这台手机上显示。</p>
    <button class="btn" id="signin" type="button">用 Google 登录</button>
  </section>

  <section class="card center" id="status" hidden><p class="msg" id="statusText">正在读取……</p></section>

  <section class="card" id="detail" hidden>
    <div class="night-title"><h2 id="dTitle"></h2><span class="sub" id="dRange"></span></div>
    <div class="stats">
      <div class="stat"><div class="k">平均</div><div class="v" id="sAvg"></div></div>
      <div class="stat"><div class="k" id="sMinK">最低</div><div class="v" id="sMin"></div></div>
      <div class="stat"><div class="k">&lt;90% 分钟</div><div class="v" id="sLowN"></div></div>
      <div class="stat"><div class="k">&lt;90% 占比</div><div class="v" id="sLowP"></div></div>
    </div>
    <div class="chart" id="chartBox"><svg id="chart" viewBox="0 0 360 200" role="img" aria-label="当晚逐分钟血氧曲线"></svg><div class="tip" id="tip" hidden></div></div>
    <div class="episodes" id="episodes"></div>
  </section>

  <section class="card trend" id="trendCard" hidden>
    <div class="sub">每晚平均与最低</div>
    <svg id="trend" viewBox="0 0 360 120" role="img" aria-label="每晚平均与最低血氧趋势"></svg>
    <div class="legend"><span><i style="background:var(--night)"></i>平均</span><span><i style="background:var(--low)"></i>最低</span><span><i style="background:var(--muted)"></i>90% 参考线</span></div>
  </section>

  <section class="list" id="list" hidden></section>

  <p class="foot" id="foot" hidden>数据来自 Google Health API（oxygen-saturation），手环只在睡眠时每分钟估算一次，Google 会剔除翻身、佩戴松动等不可靠读数，曲线有空档属正常。仅供个人参考，不能替代医疗诊断。
  <br><a href="#" id="signout">退出登录</a></p>
</div>

<script>
(function () {
  'use strict';
  var CLIENT_ID = '1044771979991-i5uu812qkvns0rt79k5m66prgkvboerf.apps.googleusercontent.com';
  var SCOPE = 'https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly';
  var API = 'https://health.googleapis.com/v4/users/me/dataTypes/oxygen-saturation/dataPoints';
  var LOW = 90, NIGHT_START = 18;
  var REDIRECT = location.origin + location.pathname;
  var $ = function (id) { return document.getElementById(id); };

  // ---------- storage (best effort) ----------
  function sget(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function sset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function sdel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // ---------- auth (OAuth 2.0 implicit flow, redirect) ----------
  function signIn() {
    var state = Math.random().toString(36).slice(2) + Date.now().toString(36);
    sset('spo2_state', state);
    var p = new URLSearchParams({
      client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: 'token',
      scope: SCOPE, include_granted_scopes: 'true', state: state
    });
    location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + p.toString());
  }
  function readHash() {
    if (!location.hash || location.hash.length < 2) return;
    var h = new URLSearchParams(location.hash.slice(1));
    history.replaceState(null, '', REDIRECT);
    if (h.get('error')) { showError('登录未完成：' + h.get('error')); return; }
    var tok = h.get('access_token');
    if (!tok) return;
    if (h.get('state') !== sget('spo2_state')) { showError('登录校验失败，请重试。'); return; }
    sdel('spo2_state');
    var exp = Date.now() + (parseInt(h.get('expires_in') || '3600', 10) - 60) * 1000;
    sset('spo2_token', tok); sset('spo2_exp', String(exp));
  }
  function token() {
    var t = sget('spo2_token'), e = parseInt(sget('spo2_exp') || '0', 10);
    return (t && Date.now() < e) ? t : null;
  }
  function signOut() { sdel('spo2_token'); sdel('spo2_exp'); showLogin(); }

  // ---------- UI states ----------
  function hideAll() { ['login', 'status', 'detail', 'trendCard', 'list', 'foot'].forEach(function (id) { $(id).hidden = true; }); }
  function showLogin() { hideAll(); $('controls').hidden = true; $('login').hidden = false; }
  function showStatus(t) { hideAll(); $('status').hidden = false; $('statusText').className = 'msg'; $('statusText').textContent = t; }
  function showError(t) { hideAll(); $('status').hidden = false; $('statusText').className = 'err'; $('statusText').textContent = t; }

  // ---------- data ----------
  function pad(n) { return String(n).padStart(2, '0'); }
  function civil(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':00'; }

  async function fetchAll(tok, start, end) {
    var filter = 'oxygen_saturation.sample_time.civil_time >= "' + civil(start) + '" AND oxygen_saturation.sample_time.civil_time < "' + civil(end) + '"';
    var out = [], pageToken = '';
    for (var guard = 0; guard < 50; guard++) {
      var p = new URLSearchParams({ filter: filter, pageSize: '10000' });
      if (pageToken) p.set('pageToken', pageToken);
      var r;
      try {
        r = await fetch(API + '?' + p.toString(), { headers: { Authorization: 'Bearer ' + tok, Accept: 'application/json' } });
      } catch (e) {
        throw new Error('网络请求失败，请检查网络后重试。（' + e.message + '）');
      }
      if (r.status === 401) { var err = new Error('auth'); err.auth = true; throw err; }
      var body = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        var m = (body.error && body.error.message) || ('HTTP ' + r.status);
        throw new Error('Google Health API 返回错误：' + m);
      }
      out = out.concat(body.dataPoints || []);
      pageToken = body.nextPageToken || '';
      if (!pageToken) break;
    }
    return out;
  }

  function parse(points) {
    var map = new Map();
    points.forEach(function (p) {
      var o = p.oxygenSaturation; if (!o || !o.sampleTime || o.percentage == null) return;
      var off = parseInt(String(o.sampleTime.utcOffset || '0s').replace('s', ''), 10) || 0;
      var t = new Date(Date.parse(o.sampleTime.physicalTime) + off * 1000); // UTC fields now hold local wall time
      var key = Math.floor(t.getTime() / 60000);
      map.set(key, +o.percentage);
    });
    return Array.from(map.entries()).sort(function (a, b) { return a[0] - b[0]; })
      .map(function (e) { return { m: e[0], v: e[1] }; }); // m = local wall-clock minutes since epoch (UTC-encoded)
  }

  // Split readings into recording sessions: a gap of more than 3 hours starts a new session.
  // (Fitbit Air can record SpO2 outside night sleep too, so a fixed "night window" mislabels data.)
  var SESSION_GAP = 180;
  function groupNights(samples) {
    var sessions = [], cur = [];
    samples.forEach(function (s) {
      if (cur.length && s.m - cur[cur.length - 1].m > SESSION_GAP) { sessions.push(cur); cur = []; }
      cur.push(s);
    });
    if (cur.length) sessions.push(cur);
    return sessions.filter(function (rows) { return rows.length >= 10; })
      .map(function (rows) { return summarize(String(rows[0].m), rows); })
      .sort(function (a, b) { return b.first - a.first; });
  }

  function summarize(key, rows) {
    var vals = rows.map(function (r) { return r.v; });
    var sum = vals.reduce(function (a, b) { return a + b; }, 0);
    var minRow = rows.reduce(function (a, b) { return b.v < a.v ? b : a; });
    var low = rows.filter(function (r) { return r.v < LOW; });
    var eps = [], cur = [];
    low.forEach(function (r) {
      if (cur.length && r.m - cur[cur.length - 1].m > 3) { eps.push(cur); cur = []; }
      cur.push(r);
    });
    if (cur.length) eps.push(cur);
    return {
      key: key, rows: rows, n: rows.length,
      avg: sum / rows.length, min: minRow.v, minAt: minRow.m, max: Math.max.apply(null, vals),
      lowN: low.length, lowP: 100 * low.length / rows.length,
      first: rows[0].m, last: rows[rows.length - 1].m,
      eps: eps.map(function (e) { return { s: e[0].m, e: e[e.length - 1].m, min: Math.min.apply(null, e.map(function (r) { return r.v; })), n: e.length }; })
    };
  }

  // ---------- formatting ----------
  var WD = '日一二三四五六';
  function hm(m) { var d = new Date(m * 60000); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); }
  function dayOf(m) { var d = new Date(m * 60000); return (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日'; }
  function wdOf(m) { return '周' + WD[new Date(m * 60000).getUTCDay()]; }
  function sameDay(a, b) { return Math.floor(a / 1440) === Math.floor(b / 1440); }
  // Title for a session: night sessions (starting 18:00 or later) are "x日晚"; others show the start day.
  function sessionLabel(n) {
    var h = new Date(n.first * 60000).getUTCHours();
    return dayOf(n.first) + ' ' + wdOf(n.first) + (h >= 18 ? ' 晚' : '');
  }
  function rangeLabel(n) {
    return hm(n.first) + '–' + (sameDay(n.first, n.last) ? '' : '次日 ') + hm(n.last);
  }
  function cls(v, kind) {
    if (kind === 'avg') return v >= 95 ? 'ok' : v >= 92 ? 'warn' : 'low';
    if (kind === 'min') return v >= LOW ? 'ok' : v >= 85 ? 'warn' : 'low';
    return v < 1 ? 'ok' : v < 5 ? 'warn' : 'low';
  }
  function setV(id, text, c) { var el = $(id); el.textContent = text; el.className = 'v ' + (c || ''); }

  // ---------- SVG helpers ----------
  var NS = 'http://www.w3.org/2000/svg';
  function mk(svg, name, attrs, text) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    svg.appendChild(e); return e;
  }

  // ---------- night chart ----------
  var current = null;
  function drawNight(n) {
    current = n;
    var svg = $('chart'); svg.innerHTML = '';
    var W = 360, H = 200, L = 34, R = 16, T = 8, B = 22;
    var x0 = Math.floor((n.first - 15) / 60) * 60, x1 = Math.ceil((n.last + 15) / 60) * 60;
    var lo = Math.min(84, Math.floor(n.min) - 1), hi = 100;
    var sx = function (m) { return L + (m - x0) / (x1 - x0) * (W - L - R); };
    var sy = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };
    for (var v = Math.ceil(lo / 2) * 2; v <= hi; v += (hi - lo > 14 ? 4 : 2)) {
      mk(svg, 'line', { x1: L, x2: W - R, y1: sy(v), y2: sy(v), stroke: 'var(--line)', 'stroke-width': 0.6 });
      mk(svg, 'text', { x: L - 4, y: sy(v) + 3.5, 'text-anchor': 'end', 'font-size': 9.5, fill: 'var(--muted)' }, v + '%');
    }
    var span = x1 - x0;
    var step = span > 960 ? 240 : span > 480 ? 120 : 60;
    for (var t = x0; t <= x1; t += step) mk(svg, 'text', { x: sx(t), y: H - 6, 'text-anchor': t + step > x1 ? 'end' : 'middle', 'font-size': 9.5, fill: 'var(--muted)' }, hm(t));
    mk(svg, 'line', { x1: L, x2: W - R, y1: sy(LOW), y2: sy(LOW), stroke: 'var(--low)', 'stroke-width': 0.8, 'stroke-dasharray': '4 3' });

    var runs = [], run = [];
    n.rows.forEach(function (r) {
      if (run.length && r.m - run[run.length - 1].m > 3) { runs.push(run); run = []; }
      run.push(r);
    });
    if (run.length) runs.push(run);
    var poly = function (arr, color, w) {
      if (arr.length === 1) { mk(svg, 'circle', { cx: sx(arr[0].m), cy: sy(arr[0].v), r: 1.4, fill: color }); return; }
      mk(svg, 'polyline', { points: arr.map(function (r) { return sx(r.m).toFixed(1) + ',' + sy(r.v).toFixed(1); }).join(' '),
        fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
    };
    runs.forEach(function (r) { poly(r, 'var(--night)', 1.1); });
    runs.forEach(function (r) {
      for (var i = 0; i < r.length; i++) {
        if (r[i].v >= LOW) continue;
        var j = i; while (j + 1 < r.length && r[j + 1].v < LOW) j++;
        poly(r.slice(Math.max(0, i - 1), Math.min(r.length, j + 2)), 'var(--low)', 1.8);
        i = j;
      }
    });
    var cursor = mk(svg, 'line', { y1: T, y2: H - B, stroke: 'var(--muted)', 'stroke-width': 0.6, visibility: 'hidden' });
    var dot = mk(svg, 'circle', { r: 3, fill: 'var(--ink)', visibility: 'hidden' });

    // scrub to read values
    var box = $('chartBox'), tip = $('tip');
    function at(evt) {
      var rect = svg.getBoundingClientRect();
      var px = (evt.clientX - rect.left) / rect.width * W;
      var m = x0 + (px - L) / (W - L - R) * (x1 - x0);
      var best = null, bd = 1e9;
      n.rows.forEach(function (r) { var d = Math.abs(r.m - m); if (d < bd) { bd = d; best = r; } });
      if (!best || bd > 10) { cursor.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.hidden = true; return; }
      var cx = sx(best.m), cy = sy(best.v);
      cursor.setAttribute('x1', cx); cursor.setAttribute('x2', cx); cursor.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('visibility', 'visible');
      tip.hidden = false; tip.textContent = hm(best.m) + '  ' + best.v.toFixed(1) + '%';
      tip.style.left = Math.max(40, Math.min(rect.width - 40, cx / W * rect.width)) + 'px';
    }
    svg.onpointerdown = svg.onpointermove = at;
    svg.onpointerleave = function () { cursor.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.hidden = true; };

    $('dTitle').textContent = sessionLabel(n);
    $('dRange').textContent = rangeLabel(n) + ' · ' + n.n + ' 个读数';
    setV('sAvg', n.avg.toFixed(1) + '%', cls(n.avg, 'avg'));
    $('sMinK').textContent = '最低 ' + hm(n.minAt);
    setV('sMin', n.min.toFixed(1) + '%', cls(n.min, 'min'));
    setV('sLowN', String(n.lowN));
    setV('sLowP', n.lowP.toFixed(1) + '%', cls(n.lowP, 'p'));
    if (n.eps.length) {
      var top = n.eps.slice().sort(function (a, b) { return a.min - b.min; }).slice(0, 5)
        .sort(function (a, b) { return a.s - b.s; });
      $('episodes').textContent = '低于 90% 的时段：' + top.map(function (e) {
        return hm(e.s) + '–' + hm(e.e) + '（最低 ' + e.min.toFixed(1) + '%）';
      }).join('；');
    } else {
      $('episodes').textContent = '整晚没有低于 90% 的有效读数。';
    }
    Array.prototype.forEach.call(document.querySelectorAll('.row'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.key === n.key ? 'true' : 'false');
    });
  }

  // ---------- trend ----------
  function drawTrend(nights) {
    var svg = $('trend'); svg.innerHTML = '';
    var data = nights.slice().reverse();
    var W = 360, H = 120, L = 30, R = 16, T = 8, B = 18;
    var lo = Math.min(84, Math.floor(Math.min.apply(null, data.map(function (n) { return n.min; }))) - 1), hi = 100;
    var sx = function (i) { return data.length === 1 ? (L + W - R) / 2 : L + i / (data.length - 1) * (W - L - R); };
    var sy = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };
    [hi, LOW, lo].forEach(function (v) {
      mk(svg, 'text', { x: L - 4, y: sy(v) + 3.5, 'text-anchor': 'end', 'font-size': 9, fill: 'var(--muted)' }, v + '%');
    });
    mk(svg, 'line', { x1: L, x2: W - R, y1: sy(LOW), y2: sy(LOW), stroke: 'var(--muted)', 'stroke-width': 0.7, 'stroke-dasharray': '4 3' });
    var line = function (key, color) {
      mk(svg, 'polyline', { points: data.map(function (n, i) { return sx(i).toFixed(1) + ',' + sy(n[key]).toFixed(1); }).join(' '),
        fill: 'none', stroke: color, 'stroke-width': 1.6, 'stroke-linejoin': 'round' });
      data.forEach(function (n, i) { mk(svg, 'circle', { cx: sx(i), cy: sy(n[key]), r: 2.4, fill: color }); });
    };
    line('avg', 'var(--night)'); line('min', 'var(--low)');
    var every = Math.ceil(data.length / 7);
    data.forEach(function (n, i) {
      if (i % every !== 0 && i !== data.length - 1) return;
      var d = new Date(n.first * 60000);
      mk(svg, 'text', { x: sx(i), y: H - 4, 'text-anchor': 'middle', 'font-size': 9, fill: 'var(--muted)' }, (d.getUTCMonth() + 1) + '/' + d.getUTCDate());
    });
  }

  // ---------- list ----------
  function drawList(nights) {
    var list = $('list'); list.innerHTML = '';
    nights.forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'row'; b.dataset.key = n.key;
      b.innerHTML = '<span class="d"></span><span class="n"></span><span class="n"></span><span class="n"></span>';
      var c = b.children;
      c[0].innerHTML = sessionLabel(n) + '<small>' + rangeLabel(n) + '</small>';
      c[1].innerHTML = '<span class="' + cls(n.avg, 'avg') + '">' + n.avg.toFixed(1) + '%</span><small>平均</small>';
      c[2].innerHTML = '<span class="' + cls(n.min, 'min') + '">' + n.min.toFixed(1) + '%</span><small>最低</small>';
      c[3].innerHTML = '<span class="' + cls(n.lowP, 'p') + '">' + n.lowN + '</span><small>&lt;90% 分钟</small>';
      b.addEventListener('click', function () { drawNight(n); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      list.appendChild(b);
    });
  }

  // ---------- main ----------
  async function load() {
    var tok = token();
    if (!tok) { showLogin(); return; }
    $('controls').hidden = false;
    var days = parseInt($('days').value, 10);
    showStatus('正在读取最近 ' + days + ' 晚的血氧数据……');
    var now = new Date();
    var end = new Date(now.getTime() + 3600000);
    var start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - days, NIGHT_START, 0, 0);
    try {
      var pts = await fetchAll(tok, start, end);
      var samples = parse(pts);
      if (!samples.length) { showError('这段时间没有血氧数据。\n请确认晚上戴着手环睡觉，并且早上已在 Google Health App 里同步。'); return; }
      var nights = groupNights(samples);
      hideAll();
      ['detail', 'trendCard', 'list', 'foot'].forEach(function (id) { $(id).hidden = false; });
      drawList(nights); drawTrend(nights); drawNight(nights[0]);
      $('sub').textContent = '更新于 ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ' · ' + samples.length + ' 个读数';
    } catch (e) {
      if (e.auth) { sdel('spo2_token'); showLogin(); return; }
      showError(e.message);
    }
  }

  $('signin').addEventListener('click', signIn);
  $('refresh').addEventListener('click', load);
  $('days').addEventListener('change', function () { sset('spo2_days', $('days').value); load(); });
  $('signout').addEventListener('click', function (e) { e.preventDefault(); signOut(); });
  var savedDays = sget('spo2_days'); if (savedDays) $('days').value = savedDays;
  readHash();
  if ($('status').hidden || !$('statusText').classList.contains('err')) load();
  window.__spo2 = { load: load, parse: parse, groupNights: groupNights };
})();
</script>
</body>
</html>
